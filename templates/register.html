<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | CloudVault</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e3a8a, #2563eb);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 950px;
            min-height: 600px;
            display: flex;
            background: white;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.25);
        }

        /* Left Panel */
        .welcome-section {
            width: 45%;
            background: linear-gradient(160deg, #1d4ed8, #2563eb);
            color: white;
            padding: 55px 45px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 55px;
        }

        .cloud-icon {
            font-size: 65px;
            margin-bottom: 25px;
        }

        .welcome-section h1 {
            font-size: 36px;
            line-height: 1.2;
            margin-bottom: 18px;
        }

        .welcome-section p {
            color: #dbeafe;
            line-height: 1.7;
            font-size: 15px;
        }

        .features {
            margin-top: 35px;
        }

        .feature {
            margin-bottom: 14px;
            font-size: 14px;
            color: #eff6ff;
        }

        /* Register Panel */
        .register-section {
            width: 55%;
            padding: 50px 65px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .register-section h2 {
            font-size: 32px;
            color: #0f172a;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 19px;
        }

        label {
            display: block;
            color: #334155;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px 15px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 5px;
        }

        button:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.25);
        }

        .login-link {
            text-align: center;
            margin-top: 23px;
            font-size: 14px;
            color: #64748b;
        }

        .login-link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .back-home {
            text-align: center;
            margin-top: 17px;
        }

        .back-home a {
            color: #64748b;
            text-decoration: none;
            font-size: 13px;
        }

        .back-home a:hover {
            color: #2563eb;
        }

        /* Mobile */
        @media (max-width: 750px) {

            .container {
                flex-direction: column;
                max-width: 500px;
            }

            .welcome-section,
            .register-section {
                width: 100%;
            }

            .welcome-section {
                padding: 35px;
                text-align: center;
            }

            .logo {
                margin-bottom: 25px;
            }

            .cloud-icon {
                font-size: 50px;
                margin-bottom: 15px;
            }

            .welcome-section h1 {
                font-size: 30px;
            }

            .features {
                display: none;
            }

            .register-section {
                padding: 40px 30px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Welcome Panel -->
        <div class="welcome-section">

            <div class="logo">
                ☁️ CloudVault
            </div>

            <div class="cloud-icon">
                ☁️
            </div>

            <h1>
                Create Your Account
            </h1>

            <p>
                Join CloudVault and securely store,
                manage and access your files from anywhere.
            </p>

            <div class="features">
                <div class="feature">✓ Secure cloud storage</div>
                <div class="feature">✓ Simple file management</div>
                <div class="feature">✓ Access files anywhere</div>
            </div>

        </div>


        <!-- Registration Form -->
        <div class="register-section">

            <h2>Create Account</h2>

            <p class="subtitle">
                Fill in your details to get started.
            </p>

            <form method="POST">

                <div class="form-group">
                    <label for="name">Full Name</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >
                </div>


                <button type="submit">
                    Create Account →
                </button>

            </form>


            <div class="login-link">
                Already have an account?
                <a href="/login">Sign in</a>
            </div>

            <div class="back-home">
                <a href="/">← Back to Home</a>
            </div>

        </div>

    </div>

</body>
</html>
