<!DOCTYPE html>
<html>
<head>
    <title>Cloud File Storage Dashboard</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background:#f4f6f9;
            margin:40px;
        }

        .container{
            width:80%;
            margin:auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0px 0px 10px rgba(0,0,0,0.2);
        }

        h1{
            text-align:center;
            color:#333;
        }

        h2{
            color:#555;
        }

        form{
            margin-top:20px;
            margin-bottom:20px;
        }

        button{
            padding:10px 18px;
            background:#007BFF;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        button:hover{
            background:#0056b3;
        }

        table{
            width:100%;
            border-collapse:collapse;
            margin-top:20px;
        }

        table th{
            background:#007BFF;
            color:white;
            padding:12px;
        }

        table td{
            padding:10px;
            text-align:center;
            border-bottom:1px solid #ddd;
        }

        a{
            text-decoration:none;
            color:blue;
            font-weight:bold;
        }

        a:hover{
            color:red;
        }

        .logout{
            float:right;
            background:red;
            color:white;
            padding:8px 15px;
            border-radius:5px;
        }

    </style>

</head>

<body>

<div class="container">

<h1>☁ Cloud File Storage</h1>

<a href="/logout" class="logout">Logout</a>

<h2>Welcome {{ name }}</h2>

<hr>

<h3>Upload New File</h3>

<form action="/upload" method="POST" enctype="multipart/form-data">

    <input type="file" name="file" required>

    <button type="submit">Upload</button>

</form>

<hr>

<h3>My Files</h3>

{% if files %}

<table>

<tr>

<th>ID</th>

<th>File Name</th>

<th>Uploaded On</th>

<th>Download</th>

<th>Delete</th>

</tr>

{% for file in files %}

<tr>

<td>{{ file[0] }}</td>

<td>{{ file[1] }}</td>

<td>{{ file[2] }}</td>

<td>

<a href="/download/{{ file[0] }}">
⬇ Download
</a>

</td>

<td>

<a href="/delete/{{ file[0] }}"
onclick="return confirm('Are you sure you want to delete this file?')">

🗑 Delete

</a>

</td>

</tr>

{% endfor %}

</table>

{% else %}

<p><b>No files uploaded yet.</b></p>

{% endif %}

</div>

</body>

</html>
